apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels:
    {{- include "dev-glue.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "dev-glue.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-ui
