apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui
  annotations:
    cert-manager.io/cluster-issuer: default-cluster-issuer
  labels:
    {{- include "dev-glue.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-ui
spec:
  ingressClassName: traefik
  rules:
    - host: kafka-ui.{{ .Values.global.projectDomain }}
      http:
        paths:
          - backend:
              service:
                name: kafka-ui
                port:
                  number: 8080
            path: /
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - kafka-ui.{{ .Values.global.projectDomain }}
      secretName: kafka-ui-tls
